name: Apply OAuth D1 schema fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch OAuth schema initialization
        run: python3 .github/scripts/ensure-oauth-schema.py

      - name: Validate Auth Worker syntax
        run: node --check melo-auth-worker.js

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add melo-auth-worker.js
          git diff --cached --quiet || git commit -m 'Initialize OAuth D1 schema automatically'
          git push
