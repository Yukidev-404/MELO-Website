name: Fix Control Room renderer ownership
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/control-room.js')
          s=p.read_text()
          old="const specializedViews=new Set(['analytics']);"
          new="const specializedViews=new Set(['users','installations','bug-reports','crashes','security','services','releases','flags','analytics','health','settings']);"
          if old not in s:
              raise SystemExit('Expected renderer ownership declaration not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/control-room.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Control Room navigation renderer conflicts"
          git push
