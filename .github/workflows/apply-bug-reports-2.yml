name: Apply MELO Bug Reports 2
on: [push]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Bug Reports
        run: |
          if [[ "${{ github.event.head_commit.message }}" == Implement\ MELO\ Bug\ Reports* ]]; then exit 0; fi
          # The Worker now has a split auth/router entrypoint. Bug-report
          # handling is already provided by legacy-worker.js in that layout.
          if grep -q 'import legacyWorker from "./legacy-worker.js";' worker.js && grep -q 'async function handleBugReports(' legacy-worker.js; then exit 0; fi
          python scripts/apply_bug_reports.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js admin/index.html admin/control-room.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Implement MELO Bug Reports'
          git push
