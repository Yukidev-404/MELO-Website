name: Deploy MELO Auth Worker

# Trigger deployment of the OAuth D1 schema fix.
on:
  push:
    branches: [main]
    paths:
      - 'melo-auth-worker.js'
      - 'wrangler-auth.jsonc'
      - '.github/workflows/deploy-auth-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Auth Worker syntax
        run: node --check melo-auth-worker.js

      - name: Guard OAuth callback schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('melo-auth-worker.js')
          source = path.read_text(encoding='utf-8')
          marker = 'async function oauthCallback(request, env, provider) {\n'
          guard = marker + '  await ensureDesktopOAuthSchema(env);\n'
          if marker not in source:
              raise SystemExit('oauthCallback function was not found')
          if guard not in source:
              source = source.replace(marker, guard, 1)
              path.write_text(source, encoding='utf-8')
          PY
          node --check melo-auth-worker.js

      - name: Deploy Auth Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-auth.jsonc --compatibility-date 2026-09-13
