name: Implement Users control-room milestone

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  users:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Users data view
        shell: python
        run: |
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()
          old = '''  if (path === "/api/admin/users") return installationsData(env, search);'''
          new = '''  if (path === "/api/admin/users") return usersData(env, search);'''
          if old not in s:
              raise SystemExit('users route marker not found')
          s = s.replace(old, new, 1)
          marker = '''async function installationsData(env, search) {'''
          fn = '''async function usersData(env, search) {
  const pattern = `%${search.replace(/[%_]/g, "\\\\$&")}%`;
  const query = search
    ? `SELECT i.installation_id, i.app_version, i.build, i.platform, i.os_version, i.client_schema, i.first_seen, i.last_seen,
         CASE WHEN tc.revoked_at IS NULL THEN 'ACTIVE' ELSE 'REVOKED' END AS telemetry_status,
         (SELECT COUNT(*) FROM telemetry_events te WHERE te.installation_id = i.installation_id) AS event_count,
         (SELECT COUNT(*) FROM crash_reports cr WHERE cr.installation_id = i.installation_id) AS crash_count
       FROM installations i LEFT JOIN telemetry_credentials tc ON tc.installation_id = i.installation_id
       WHERE i.installation_id LIKE ? ESCAPE '\\\\' OR i.app_version LIKE ? ESCAPE '\\\\' OR i.build LIKE ? ESCAPE '\\\\' OR i.platform LIKE ? ESCAPE '\\\\' OR i.os_version LIKE ? ESCAPE '\\\\'
       ORDER BY i.last_seen DESC LIMIT 200`
    : `SELECT i.installation_id, i.app_version, i.build, i.platform, i.os_version, i.client_schema, i.first_seen, i.last_seen,
         CASE WHEN tc.revoked_at IS NULL THEN 'ACTIVE' ELSE 'REVOKED' END AS telemetry_status,
         (SELECT COUNT(*) FROM telemetry_events te WHERE te.installation_id = i.installation_id) AS event_count,
         (SELECT COUNT(*) FROM crash_reports cr WHERE cr.installation_id = i.installation_id) AS crash_count
       FROM installations i LEFT JOIN telemetry_credentials tc ON tc.installation_id = i.installation_id
       ORDER BY i.last_seen DESC LIMIT 200`;
  const result = search
    ? await env.DB.prepare(query).bind(pattern, pattern, pattern, pattern, pattern).all()
    : await env.DB.prepare(query).all();
  return json({ ok: true, rows: result?.results || [] });
}

'''
          if marker not in s:
              raise SystemExit('installations function marker not found')
          s = s.replace(marker, fn + marker, 1)
          p.write_text(s)

          p = Path('admin/control-room.js')
          s = p.read_text()
          old = "users:[['installation_id','Installation ID'],['app_version','MELO Version'],['last_seen','Last Seen'],['platform','Platform'],['os_version','OS'],['build','Build']],"
          new = "users:[['installation_id','Installation ID'],['app_version','MELO Version'],['last_seen','Last Seen'],['platform','Platform'],['os_version','OS'],['telemetry_status','Telemetry'],['event_count','Events'],['crash_count','Crashes']],"
          if old not in s:
              raise SystemExit('users config marker not found')
          s = s.replace(old, new, 1)
          old = "function format(key,v){return key.endsWith('_at')||['timestamp','first_seen','last_seen'].includes(key)?date(v):key==='enabled'?(Number(v)?'ON':'OFF'):v}"
          new = "function format(key,v){return key.endsWith('_at')||['timestamp','first_seen','last_seen'].includes(key)?date(v):key==='enabled'?(Number(v)?'ON':'OFF'):key==='telemetry_status'?(String(v)==='ACTIVE'?'ACTIVE':'REVOKED'):v}"
          if old not in s:
              raise SystemExit('format marker not found')
          s = s.replace(old, new, 1)
          old = "  users:[['installation_id','Installation ID'],['app_version','MELO Version'],['last_seen','Last Seen'],['platform','Platform'],['os_version','OS'],['build','Build']],"
          if old in s:
              pass
          p.write_text(s)

          p = Path('admin/control-room.js')
          s = p.read_text()
          old = "  users:[['installation_id','Installation ID'],['app_version','MELO Version'],['last_seen','Last Seen'],['platform','Platform'],['os_version','OS'],['telemetry_status','Telemetry'],['event_count','Events'],['crash_count','Crashes']],"
          if old not in s:
              raise SystemExit('updated users config missing')
          oldcopy = "users:{title:'Users',heading:'Users',copy:'Telemetry-backed MELO installations. Account-level user management is not enabled yet.'}"
          newcopy = "users:{title:'Users',heading:'Users',copy:'Operational view of MELO installations. Account identity is intentionally not collected; telemetry status and activity are shown safely.'}"
          if oldcopy not in s:
              raise SystemExit('users copy marker not found')
          s = s.replace(oldcopy, newcopy, 1)
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js admin/control-room.js
          git diff --cached --quiet || git commit -m 'Upgrade Users control-room data view'
          git push
