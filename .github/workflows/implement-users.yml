name: Implement Users control-room milestone

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Users data view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()
          old = '  if (path === "/api/admin/users") return installationsData(env, search);'
          new = '  if (path === "/api/admin/users") return usersData(env, search);'
          assert old in s, 'users route marker not found'
          s = s.replace(old, new, 1)
          marker = 'async function installationsData(env, search) {'
          fn = r'''async function usersData(env, search) {
  const pattern = `%${search.replace(/[%_]/g, "\\$&")}%`;
  const base = `SELECT i.installation_id, i.app_version, i.build, i.platform, i.os_version, i.client_schema, i.first_seen, i.last_seen,
    CASE WHEN tc.revoked_at IS NULL THEN 'ACTIVE' ELSE 'REVOKED' END AS telemetry_status,
    (SELECT COUNT(*) FROM telemetry_events te WHERE te.installation_id = i.installation_id) AS event_count,
    (SELECT COUNT(*) FROM crash_reports cr WHERE cr.installation_id = i.installation_id) AS crash_count
    FROM installations i LEFT JOIN telemetry_credentials tc ON tc.installation_id = i.installation_id`;
  const where = search ? ` WHERE i.installation_id LIKE ? ESCAPE '\\' OR i.app_version LIKE ? ESCAPE '\\' OR i.build LIKE ? ESCAPE '\\' OR i.platform LIKE ? ESCAPE '\\' OR i.os_version LIKE ? ESCAPE '\\'` : '';
  const result = search
    ? await env.DB.prepare(`${base}${where} ORDER BY i.last_seen DESC LIMIT 200`).bind(pattern, pattern, pattern, pattern, pattern).all()
    : await env.DB.prepare(`${base} ORDER BY i.last_seen DESC LIMIT 200`).all();
  return json({ ok: true, rows: result?.results || [] });
}

'''
          assert marker in s, 'installations function marker not found'
          s = s.replace(marker, fn + marker, 1)
          p.write_text(s)

          p = Path('admin/control-room.js')
          s = p.read_text()
          old = "users:[['installation_id','Installation ID'],['app_version','MELO Version'],['last_seen','Last Seen'],['platform','Platform'],['os_version','OS'],['build','Build']],"
          new = "users:[['installation_id','Installation ID'],['app_version','MELO Version'],['last_seen','Last Seen'],['platform','Platform'],['os_version','OS'],['telemetry_status','Telemetry'],['event_count','Events'],['crash_count','Crashes']],"
          assert old in s, 'users config marker not found'
          s = s.replace(old, new, 1)
          old = "users:{title:'Users',heading:'Users',copy:'Telemetry-backed MELO installations. Account-level user management is not enabled yet.'}"
          new = "users:{title:'Users',heading:'Users',copy:'Operational view of MELO installations. Account identity is intentionally not collected; telemetry status and activity are shown safely.'}"
          assert old in s, 'users copy marker not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js admin/control-room.js
          git diff --cached --quiet || git commit -m 'Upgrade Users control-room data view'
          git push
