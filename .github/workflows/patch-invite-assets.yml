name: Apply administrator invitation asset routing fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Apply administrator invitation asset routing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch invitation asset routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-auth-worker.js')
          s = p.read_text()
          old = 'export default{async fetch(request,env){const url=new URL(request.url);try{if(url.pathname==="/api/admin/status"'
          new = 'export default{async fetch(request,env){const url=new URL(request.url);try{if(url.pathname==="/admin/admin-invite.html"||url.pathname==="/admin/admin-invite.js")return env.ASSETS.fetch(request);if(url.pathname==="/api/admin/status"'
          if old not in s:
              raise SystemExit('Worker fetch routing marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify invitation routing
        run: |
          grep -q 'url.pathname==="/admin/admin-invite.html"||url.pathname==="/admin/admin-invite.js"' admin-auth-worker.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-auth-worker.js
          git commit -m 'Fix administrator invitation asset routing'
          git push
