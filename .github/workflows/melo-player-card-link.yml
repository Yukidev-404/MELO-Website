name: Link MELO Player Card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/melo-player-card-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Player Card link
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old='href="login.html"'
          new='href="player-card.html"'
          if old not in t:
              raise SystemExit('Player Card link anchor not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/melo-player-card-link.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/melo-player-card-link.yml
          git diff --cached --quiet && exit 0
          git commit -m "Link Player Card to listening stats [skip ci]"
          git push
