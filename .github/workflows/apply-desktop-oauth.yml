name: Apply Desktop OAuth backend patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/apply-desktop-oauth.py
      - name: Validate
        run: node --check melo-auth-worker.js
      - name: Commit patched Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add melo-auth-worker.js
          git diff --cached --quiet || git commit -m 'Add secure Desktop OAuth backend handoff'
          git push || true
