name: Add MELO stats API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/melo-stats-worker-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch stats API
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          path = Path('melo-auth-worker.js')
          text = path.read_text(encoding='utf-8')
          marker = "async function handle(request, env) {"
          if 'async function ensureStatsSchema' not in text:
              stats = r'''

async function ensureStatsSchema(env) {
  await env.DB.prepare(`CREATE TABLE IF NOT EXISTS listening_events (
    id TEXT PRIMARY KEY, user_id TEXT NOT NULL, event_type TEXT NOT NULL, source TEXT,
    track_id TEXT, track_key TEXT, title TEXT, artist TEXT, album TEXT,
    duration_seconds INTEGER NOT NULL DEFAULT 0, listened_seconds INTEGER NOT NULL DEFAULT 0,
    created_at INTEGER NOT NULL
  )`).run();
}
async function statsEvent(request, env) {
  await ensureStatsSchema(env);
  const session = await getSession(request, env);
  if (!session) return json({ error: 'Authentication required.' }, 401, {}, request);
  const body = await readBody(request), eventType = String(body?.event_type || '').trim().toLowerCase();
  if (!['play','listen','favorite','unfavorite'].includes(eventType)) return json({ error: 'Invalid stats event.' }, 400, {}, request);
  const source = String(body?.source || '').trim().toUpperCase().slice(0,20);
  const trackId = String(body?.track_id || '').trim().slice(0,200);
  const trackKey = String(body?.track_key || '').trim().slice(0,500);
  const title = String(body?.title || 'Unknown Track').trim().slice(0,300);
  const artist = String(body?.artist || 'Unknown Artist').trim().slice(0,300);
  const album = String(body?.album || 'Unknown Album').trim().slice(0,300);
  const duration = Math.max(0, Math.min(86400, Number(body?.duration_seconds || 0) | 0));
  const listened = Math.max(0, Math.min(86400, Number(body?.listened_seconds || 0) | 0));
  await env.DB.prepare(`INSERT INTO listening_events (id,user_id,event_type,source,track_id,track_key,title,artist,album,duration_seconds,listened_seconds,created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?)`).bind(id(),session.user_id,eventType,source,trackId,trackKey,title,artist,album,duration,listened,now()).run();
  return json({ ok:true },201,{},request);
}
async function statsSummary(request, env) {
  await ensureStatsSchema(env);
  const session = await getSession(request, env);
  if (!session) return json({ error:'Authentication required.' },401,{},request);
  const rows = await env.DB.prepare(`SELECT event_type,track_id,track_key,title,artist,listened_seconds,created_at FROM listening_events WHERE user_id=? ORDER BY created_at DESC LIMIT 20000`).bind(session.user_id).all();
  const events=rows.results||[], plays=events.filter(e=>e.event_type==='play'), listens=events.filter(e=>e.event_type==='listen');
  const totalListeningSeconds=listens.reduce((n,e)=>n+Number(e.listened_seconds||0),0);
  const uniqueTracks=new Set(plays.map(e=>String(e.track_key||e.track_id||`${e.title}|${e.artist}`))).size;
  const fav=new Map(); for(const e of [...events].reverse()){if(e.event_type==='favorite'||e.event_type==='unfavorite') fav.set(String(e.track_key||e.track_id||`${e.title}|${e.artist}`),e.event_type==='favorite');}
  const favorites=[...fav.values()].filter(Boolean).length;
  const activeDates=new Set(events.map(e=>new Date(Number(e.created_at)*1000).toISOString().slice(0,10)));
  const d=new Date(), dk=x=>x.toISOString().slice(0,10); let streak=0;
  for(let i=0;i<3660;i++){const x=new Date(d.getTime()-i*86400000);if(!activeDates.has(dk(x)))break;streak++;}
  const top=key=>{const m=new Map();for(const e of plays){const v=String(e[key]||'Unknown').trim()||'Unknown';m.set(v,(m.get(v)||0)+1);}return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0]||null;};
  const artist=top('artist'), track=top('title'), xp=plays.length*10+Math.floor(totalListeningSeconds/60)*2+favorites*25, level=Math.max(1,Math.floor(xp/100)+1), levelXp=xp%100;
  return json({user:{id:session.user_id,email:session.email,display_name:session.display_name,avatar_url:session.avatar_url||null},stats:{tracks_played:plays.length,total_listening_seconds:totalListeningSeconds,unique_tracks:uniqueTracks,favorites,days_active:activeDates.size,listening_streak:streak,top_artist:artist?{name:artist[0],plays:artist[1]}:null,top_track:track?{name:track[0],plays:track[1]}:null,xp,level,level_xp:levelXp,level_progress:levelXp/100}},200,{},request);
}
'''
              if marker not in text: raise SystemExit('Could not find handle marker')
              text=text.replace(marker,stats+'\n'+marker,1)
          route="    if (path === '/api/stats/event' && request.method === 'POST') return await statsEvent(request, env);\n    if (path === '/api/stats' && request.method === 'GET') return await statsSummary(request, env);\n"
          anchor="    if (path === '/api/auth/signup' && request.method === 'POST') return await signup(request, env);\n"
          if "path === '/api/stats/event'" not in text:
              if anchor not in text: raise SystemExit('Could not find route anchor')
              text=text.replace(anchor,route+anchor,1)
          path.write_text(text,encoding='utf-8')
          subprocess.run(['node','--check','melo-auth-worker.js'],check=True)
      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/melo-stats-worker-patch.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add melo-auth-worker.js .github/workflows/melo-stats-worker-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add MELO listening stats API [skip ci]"
          git push
