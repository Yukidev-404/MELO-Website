name: MELO Website Stats Audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect worker stats routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('melo-auth-worker.js').read_text(encoding='utf-8')
          lines=src.splitlines()
          needles=['export default','async fetch','/api/','getSession','auth/me','auth/login','logout','stats']
          out=[]
          for needle in needles:
              out.append(f'===== {needle} =====')
              rx=re.compile(re.escape(needle),re.I)
              hits=[i for i,l in enumerate(lines) if rx.search(l)]
              for i in hits[:120]:
                  a=max(0,i-5); b=min(len(lines),i+7)
                  out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
                  out.append('---')
          Path('STATS_AUDIT.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATS_AUDIT.txt
          git commit -m 'Audit website stats routes [skip ci]' || true
          git push
      - name: Remove audit workflow
        run: |
          rm -f .github/workflows/melo-stats-audit.yml
          git add -A
          git commit -m 'Remove temporary website stats audit workflow [skip ci]' || true
          git push
