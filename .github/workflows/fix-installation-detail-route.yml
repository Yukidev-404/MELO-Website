name: Fix installation detail route

on:
  push:

jobs:
  patch-worker:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix installation detail route') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch worker.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('worker.js')
          text = path.read_text(encoding='utf-8')

          marker = '  if (url.pathname === "/api/admin/health" && request.method === "GET") return json({ ok: true, service: "melo-admin" });\n'
          if 'url.pathname === "/api/admin/installation"' in text:
              print('Installation detail route already present; nothing to do.')
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit('Could not find admin health route marker.')

          route = '''
  if (url.pathname === "/api/admin/installation" && request.method === "GET") {
    const session = await getSession(request, env);
    if (!session) return json({ authenticated: false }, 401);

    const installationId = url.searchParams.get("id") || "";
    if (!/^[A-Za-z0-9_-]{16,128}$/.test(installationId)) {
      return json({ error: "Invalid installation ID." }, 400);
    }

    const installation = await env.DB.prepare(`
      SELECT
        installation_id,
        app_version,
        build,
        platform,
        os_version,
        client_schema,
        first_seen,
        last_seen,
        created_at,
        updated_at
      FROM installations
      WHERE installation_id = ?
    `).bind(installationId).first();

    if (!installation) {
      return json({ error: "Installation not found." }, 404);
    }

    const [events, crashes, credential] = await Promise.all([
      env.DB.prepare(`
        SELECT
          event_id,
          event_type,
          timestamp,
          app_version,
          build,
          platform,
          os_version,
          client_schema,
          created_at
        FROM telemetry_events
        WHERE installation_id = ?
        ORDER BY timestamp DESC
        LIMIT 500
      `).bind(installationId).all(),

      env.DB.prepare(`
        SELECT
          crash_id,
          event_id,
          error_type,
          message,
          stack_trace,
          severity,
          app_version,
          build,
          platform,
          os_version,
          timestamp,
          created_at
        FROM crash_reports
        WHERE installation_id = ?
        ORDER BY timestamp DESC
        LIMIT 100
      `).bind(installationId).all(),

      env.DB.prepare(`
        SELECT
          created_at,
          last_used_at,
          revoked_at
        FROM telemetry_credentials
        WHERE installation_id = ?
      `).bind(installationId).first()
    ]);

    return json({
      ok: true,
      installation,
      events: events?.results || [],
      crashes: crashes?.results || [],
      telemetry: credential
        ? {
            active: !credential.revoked_at,
            createdAt: credential.created_at,
            lastUsedAt: credential.last_used_at,
            revokedAt: credential.revoked_at
          }
        : null
    });
  }
'''

          text = text.replace(marker, marker + route, 1)
          path.write_text(text, encoding='utf-8')
          print('Installation detail route inserted.')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix installation detail route'
          git push
