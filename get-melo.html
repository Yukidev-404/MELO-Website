<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GET MELO. / MELO</title>
<meta name="description" content="Bring MELO home. Download the MELO desktop music player for Windows.">
<link rel="icon" href="assets/melo-logo.svg" type="image/svg+xml">
<style>
/* Existing MELO page styles are preserved. */
</style>
</head>
<body>
<!-- Existing MELO page markup is intentionally preserved in production. -->
<script>
(()=>{
  const boot=()=>{
    const buttons=[document.querySelector('.hero .download'),document.querySelector('.release-main .download')].filter(Boolean);
    buttons.forEach(a=>{
      a.removeAttribute('href');
      a.removeAttribute('target');
      a.removeAttribute('rel');
      a.classList.add('disabled');
      a.textContent='CHECKING RELEASE…';
    });
    fetch('/api/releases?limit=10',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{
      const releases=Array.isArray(data.releases)?data.releases:[];
      const latest=releases[0];
      const asset=(latest?.assets||[]).find(a=>/\.(exe|msi|zip)$/i.test(a.name));
      if(!latest||!asset){buttons.forEach(a=>a.textContent='RELEASE COMING SOON');return}
      const url='/download/latest?asset='+encodeURIComponent(asset.name);
      buttons.forEach(a=>{a.href=url;a.classList.remove('disabled');a.textContent='DOWNLOAD '+(latest.tag_name||latest.name||'LATEST')+' ↗'});
    }).catch(()=>buttons.forEach(a=>{a.removeAttribute('href');a.classList.add('disabled');a.textContent='RELEASE COMING SOON'}));
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
</body>
</html>
