<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MELO / ACCOUNT SETUP</title><script>if(location.hostname==='yukidev-404.github.io'){location.replace('https://melo-website.tajtaranga.workers.dev/admin/admin-invite.html'+location.search)}</script><link rel="stylesheet" href="../control-room.css"><link rel="stylesheet" href="../melo-theme.css"><style>body{min-height:100vh;display:grid;place-items:center}.setup{width:min(500px,calc(100% - 40px));background:#111115;border:1px solid rgba(255,255,255,.09);padding:32px;box-sizing:border-box}.brand{font-weight:800;letter-spacing:.08em}.brand small{display:block;font-size:9px;color:#888;margin-top:4px}.kicker{margin:30px 0 7px;font-size:9px;letter-spacing:.12em;color:#f1a9c8}.setup h1{font-size:24px;margin:0 0 8px}.copy{font-size:12px;line-height:1.7;color:#97939b}.field{margin-top:18px}.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;background:#0b0b0e;border:1px solid rgba(255,255,255,.12);color:#eee;padding:12px;font:14px inherit}.field input:focus{outline:none;border-color:rgba(244,139,191,.5)}button{margin-top:18px;width:100%;padding:13px;border:1px solid #f4a6c9;background:#f4a6c9;color:#171217;font-weight:800;letter-spacing:.08em;cursor:pointer}.qr{margin:20px auto;padding:12px;width:210px;background:#fff}.qr img{display:block;width:100%;height:auto}.key{font-family:monospace;word-break:break-all;color:#f1b5d0}.message{margin-top:14px;min-height:16px;font-size:11px;color:#ff8aa8}.success{color:#8ed9ad}.hidden{display:none}</style></head><body><main class="setup"><div class="brand">MELO<small>CONTROL ROOM</small></div><div class="kicker">ADMINISTRATOR ACCOUNT SETUP</div><h1 id="title">Invitation</h1><p class="copy" id="copy">Checking your invitation…</p><div id="setup" class="hidden"><div class="field"><label>USERNAME</label><input id="username" readonly></div><div class="field"><label>AUTHENTICATOR</label><div class="qr"><img id="qr" alt="Authenticator QR code"></div><p class="copy">Scan this QR code with your Authenticator app. If you cannot scan it, use this setup key:</p><div class="key" id="key"></div></div><div class="field"><label>6-DIGIT AUTHENTICATOR CODE</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><button id="verify">VERIFY &amp; ENTER CONTROL ROOM →</button></div><div id="start"><button id="begin">SET UP AUTHENTICATOR →</button></div><div class="message" id="message"></div></main><script src="admin-invite.js?v=245867a"></script></body></html>
