<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MELO / MUSIC PLAYER</title><link rel="icon" href="assets/melo-cat.png" type="image/png">
<link rel="stylesheet" href="player.css?v=20260917-4">
<link rel="stylesheet" href="player-reference-ui.css?v=20260920-17">
<link rel="stylesheet" href="player-icons.css?v=20260917-2">
</head><body>
<div id="app" class="melo-window">
<header class="titlebar"><div class="brand"><b>MELO</b><span>/ MUSIC PLAYER</span></div><div class="window-controls"><button type="button" data-window="min" aria-label="Minimize">—</button><button type="button" data-window="max" aria-label="Maximize">□</button><button type="button" data-window="close" aria-label="Close">×</button></div></header>
<main class="workspace">
<section class="player-pane">
<div class="pane-head"><span>[ NOW PLAYING ]</span><span>RETRO-MOD</span></div>
<div class="record-wrap"><img class="record" id="record" src="assets/disc_texture_centered.png" alt="MELO record"><img class="tonearm" id="tonearm" src="assets/arm_overlay_centered.png" alt=""></div>
<div class="track-info"><div id="trackTitle">NO TRACK PLAYING</div><small id="trackArtist">SELECT MUSIC TO BEGIN</small></div>
<div class="time-row"><button id="lyrics" class="icon-button" title="Lyrics"><img src="assets/lyrics_icon.png" alt="lyrics"></button><span id="elapsed">0:00</span><span class="time-total" id="duration">0:00</span><button id="favorite" class="icon-button favorite"><img src="assets/favorite_wave.png" alt="favorite"></button></div>
<div class="progress" id="progress"><i id="progressFill"></i></div>
<div class="transport"><button id="shuffle" class="asset-control" title="Shuffle"><img src="assets/shuffle_icon.png" alt="Shuffle"></button><button id="previous" title="Previous">|◀</button><button id="play" class="play"><img id="playIcon" src="assets/cat_play.png" alt="play"></button><button id="next" title="Next">▶|</button><button id="repeat" class="asset-control" title="Repeat"><img src="assets/repeat_bunny.png" alt="Repeat"></button></div>
<div class="visual-label">LOW | HIGH</div><div class="visualizer" id="visualizer"></div>
<div class="volume-row"><span>VOL.</span><input id="volume" type="range" min="0" max="100" value="75"><span id="volumeValue">75%</span></div>
<button class="device" id="device"><img src="assets/output_device_icon.png" alt=""><span id="deviceName">DEVICE: SYSTEM DEFAULT</span></button>
<div class="settings-link" id="settings">TOOLS &amp; SETTINGS</div>
</section>
<section class="library-pane">
<div class="search-row"><input id="search" placeholder="Search music..." autocomplete="off"><button id="searchButton">⌕</button><button id="overflow">⋯</button></div>
<div class="library-title"><span>Your Music</span><span id="sourceStatus"></span></div>
<nav class="tabs"><button class="active" data-tab="LIBRARY">LIST</button><button data-tab="QUEUE">QUEUE</button><button data-tab="PLAYLISTS">PLAYLISTS</button><button data-tab="RECENT">RECENT</button><button data-tab="FAVORITES">FAVORITES</button><button id="source">SPOTIFY</button></nav>
<section class="content" id="content"><div class="empty">NO MUSIC AVAILABLE</div></section>
</section>
</main>
<div class="lyrics-panel" id="lyricsPanel"><button id="closeLyrics">×</button><div>MELO / LYRICS</div><h2 id="lyricsTitle">Lyrics</h2><p id="lyricsArtist"></p><div class="lyrics-body" id="lyricsBody">NO LYRICS</div></div>
<input id="folder" type="file" accept="audio/*" multiple hidden><audio id="audio" preload="metadata"></audio>
</div><script src="player.js?v=20260920-1"></script>
<script src="https://sdk.scdn.co/spotify-player.js"></script><script src="player-reference-ui.js?v=20260917-2"></script><script src="player-stats-sync.js?v=20260917-2"></script></body></html>
